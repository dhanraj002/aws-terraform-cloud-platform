name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.1'
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra test
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate
      - name: Build and exercise hardened container
        run: |
          docker build -t release-probe:test .
          docker run -d --name probe --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8080:8080 release-probe:test
          trap 'docker logs probe; docker rm -f probe' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/healthz
          curl --fail --silent http://127.0.0.1:8080/readyz
