name: Deploy lab
on:
  workflow_dispatch:
    inputs:
      fail_readiness:
        description: 'Failure drill: deploy an unhealthy candidate (expected to fail)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-platform-lab
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: lab
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-central-1
      ECR_REPOSITORY: release-platform
      ECS_CLUSTER: release-platform
      ECS_SERVICE: release-platform
      FAILURE_DRILL: ${{ inputs.fail_readiness }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build and push a unique release image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
          TAG="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker build --platform linux/amd64 -t "$REGISTRY/$ECR_REPOSITORY:$TAG" .
          docker run -d --name preflight --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8080:8080 "$REGISTRY/$ECR_REPOSITORY:$TAG"
          trap 'docker rm -f preflight' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/readyz
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)
          echo "uri=$REGISTRY/$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Deploy and verify the exact revision
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$FAILURE_DRILL" = true ]; then ARGS+=(--fail-readiness); fi
          python scripts/deploy.py --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --image "$IMAGE_URI" --revision "$GITHUB_SHA" "${ARGS[@]}"
